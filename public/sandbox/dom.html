<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Code example sandbox</title>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; padding: 12px 16px; font-size: 14px; line-height: 1.5; background: #fff; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p, ul { margin: 0 0 8px; }
  button { font: inherit; padding: 4px 10px; border-radius: 8px; border: 1px solid #94a3b8; background: transparent; color: inherit; }
</style>
</head>
<body>
<!-- A small page for lesson examples that use document, window, alert or storage.
     Loaded in <iframe sandbox="allow-scripts allow-modals"> (an opaque origin, so it can't reach the
     site's DOM, cookies or storage) under its own CSP: no network, eval allowed for the example. -->
<h1>Sample heading</h1>
<p id="message">A sample paragraph.</p>
<ul id="list"><li>Apples</li></ul>
<button type="button">Sample button</button>
<script src="dom.js"></script>
</body>
</html>
